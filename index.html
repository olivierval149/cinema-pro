<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Action & Thriller AI Studio V2.0</title>
    <style>
        :root {
            --bg-color: #0d0d0d;
            --card-bg: #161618;
            --input-bg: #222226;
            --border-color: #333338;
            --primary: #e50914;
            --primary-hover: #ff1e27;
            --text-main: #ffffff;
            --text-sub: #a0a0a0;
            --accent-gold: #ffb703;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
        }

        .app-container {
            width: 100%;
            max-width: 650px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 0;
        }

        .logo-title {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            background: var(--primary);
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
        }

        h1 {
            font-size: 22px;
            margin: 0;
            font-weight: 900;
            letter-spacing: 0.5px;
        }

        h1 span {
            color: var(--primary);
        }

        .badge {
            background: rgba(229, 9, 20, 0.2);
            color: var(--primary);
            border: 1px solid var(--primary);
            font-size: 11px;
            padding: 4px 8px;
            border-radius: 6px;
            font-weight: bold;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .card-title {
            font-size: 15px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 0;
            color: #fff;
        }

        .card-subtitle {
            font-size: 11px;
            color: var(--text-sub);
            margin-left: auto;
            font-weight: normal;
        }

        input[type="password"], textarea, select {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
        }

        textarea {
            height: 90px;
            resize: vertical;
        }

        .presets-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .preset-btn {
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            text-align: left;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
        }

        .preset-btn:active {
            border-color: var(--primary);
            background: rgba(229, 9, 20, 0.1);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 12px;
            color: var(--text-sub);
            font-weight: 600;
        }

        .btn-generate {
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 16px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            text-align: center;
            box-shadow: 0 4px 15px rgba(229, 9, 20, 0.4);
        }

        #outputCard {
            display: none;
            background: var(--card-bg);
            border: 1px solid var(--primary);
            border-radius: 14px;
            padding: 18px;
        }

        .result-box {
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            padding: 12px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 13px;
            color: #e0e0e0;
            white-space: pre-wrap;
            word-break: break-word;
            max-height: 250px;
            overflow-y: auto;
        }
    </style>
</head>
<body>

<div class="app-container">
    
    <div class="header">
        <div class="logo-title">
            <div class="logo-icon">🎬</div>
            <h1>ACTION <span>& THRILLER</span></h1>
        </div>
        <div class="badge">AI STUDIO V2.0</div>
    </div>

    <!-- API KEY -->
    <div class="card">
        <div class="card-title">
            🔑 Clé API Google Gemini
            <span class="card-subtitle">Gratuit & Sécurisé</span>
        </div>
        <input type="password" id="apiKey" placeholder="Collez votre clé API Google Gemini ici">
    </div>

    <!-- PRESETS -->
    <div class="card">
        <div class="card-title">🎬 Préréglages de Scène</div>
        <div class="presets-grid">
            <button class="preset-btn" onclick="setPreset('chase')">🏎️ Course Poursuite</button>
            <button class="preset-btn" onclick="setPreset('night')">👤 Traque Nocturne</button>
            <button class="preset-btn" onclick="setPreset('action')">💥 Infiltration / Explosion</button>
            <button class="preset-btn" onclick="setPreset('heist')">🥷 Braquage Haute Tension</button>
        </div>
    </div>

    <!-- MAIN PROMPT -->
    <div class="card">
        <div class="card-title">Description de votre idée :</div>
        <textarea id="prompt" placeholder="Ex: Une Audi RS6 noire engagée dans une course-poursuite à vive allure sous la pluie à minuit, feux xénon, caméra au ras du sol..."></textarea>

        <div class="form-row">
            <div class="form-group">
                <label>Ambiance Visuelle</label>
                <select id="style">
                    <option value="Dark Thriller (Nolan/Fincher)">Dark Thriller (Cinématique)</option>
                    <option value="Action Blockbuster (Michael Bay)">Action Explosive (Blockbuster)</option>
                    <option value="Neo-Noir Cyberpunk">Neo-Noir (Néon / Pluie)</option>
                </select>
            </div>
            <div class="form-group">
                <label>Mouvement Caméra</label>
                <select id="camera">
                    <option value="Suivi Dynamique Ras du Sol">Suivi Dynamique Ras du Sol</option>
                    <option value="Vue Drone Plongée">Vue Drone Plongée</option>
                    <option value="Caméra Épaule Immersive">Caméra Épaule Immersive</option>
                </select>
            </div>
        </div>
    </div>

    <button class="btn-generate" onclick="generateContent()">🚀 GÉNÉRER LA SCÈNE</button>

    <!-- OUTPUT -->
    <div id="outputCard" class="card">
        <div class="card-title">✨ Résultat Généré</div>
        <div class="result-box" id="resultText">Génération en cours...</div>
    </div>

</div>

<script>
    function setPreset(type) {
        const promptInput = document.getElementById('prompt');
        if(type === 'chase') {
            promptInput.value = "Course-poursuite à haute vitesse entre deux voitures sportives dans des ruelles étroites et sombres, reflets sur l'asphalte mouillé, plans de caméra très dynamiques au ras des roues.";
        } else if(type === 'night') {
            promptInput.value = "Un détective en trench-coat traque une ombre sous la pluie battante dans une ruelle éclairée par de vieux néons, ambiance de tension extrême, gros plans expressifs.";
        } else if(type === 'action') {
            promptInput.value = "Infiltration nocturne d'un entrepôt sécurisé, effets de fumée, lasers de sécurité, suivi de caméra style action militaire.";
        } else if(type === 'heist') {
            promptInput.value = "Équipe en tenue noire d'intervention pénétrant rapidement dans un hall moderne, mouvement de caméra fluide et rapide style braquage sous haute tension.";
        }
    }

    async function generateContent() {
        const apiKey = document.getElementById('apiKey').value;
        const prompt = document.getElementById('prompt').value;
        const style = document.getElementById('style').value;
        const camera = document.getElementById('camera').value;
        const outputCard = document.getElementById('outputCard');
        const resultText = document.getElementById('resultText');

        if (!apiKey) {
            alert('Veuillez entrer votre clé API Google Gemini.');
            return;
        }
        if (!prompt) {
            alert('Veuillez entrer une description de scène.');
            return;
        }

        outputCard.style.display = 'flex';
        resultText.innerText = "⏳ Génération du scénario & du prompt vidéo optimisé par l'IA...";

        const fullPrompt = `Tu es un réalisateur de films d'action et thriller. À partir de cette idée : "${prompt}", avec une ambiance "${style}" et un mouvement de caméra "${camera}", génère :
1. Un scénario détaillé de la scène (description visuelle, bruitages, ambiance).
2. Un PROMPT VIDÉO OPTIMISÉ en anglais à copier-coller dans des IA vidéo comme Kling AI, Luma ou Runway.`;

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: fullPrompt }] }]
                })
            });

            const data = await response.json();
            if (data.candidates && data.candidates[0].content.parts[0].text) {
                resultText.innerText = data.candidates[0].content.parts[0].text;
            } else {
                resultText.innerText = "❌ Erreur : Vérifiez votre clé API.";
            }
        } catch (error) {
            resultText.innerText = "❌ Erreur lors de la connexion à l'API Gemini.";
        }
    }
</script>

</body>
</html>
